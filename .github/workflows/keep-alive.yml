name: keep-alive

# Pings the deployed Render service every 14 minutes so the free-tier
# instance never sleeps (Render free tier idle-sleeps after 15 min).
# Set REPO secret RENDER_URL to https://<your-app>.onrender.com.
#
# This is a reasonable use of GitHub Actions for public repos
# (effectively free). For private repos, watch your monthly minutes
# budget.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /health
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret not set; skipping" >&2
            exit 0
          fi
          # -fsS so we fail loudly on 4xx/5xx, --max-time so a slow
          # cold start doesn't burn the workflow.
          curl -fsS --max-time 60 "$RENDER_URL/health"
